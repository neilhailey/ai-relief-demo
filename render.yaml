services:
  - type: web
    name: ai-relief-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # you'll paste this in the Render dashboard
      - key: CORS_ORIGINS
        sync: false          # paste your Vercel URL here after deploying frontend
      - key: PYTHON_VERSION
        value: 3.12.0
